name: Deploy Infrastructure with Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose the environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      region:
        description: "Choose AWS region"
        required: true
        default: "us-east-1"
        type: choice
        options:
          - us-east-1
          - eu-north-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Debug Directory Structure
        run: ls -R

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ./tf

      - name: Set Terraform Variables File
        run: echo "TFVARS_FILE=region.${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}.tfvars" >> $GITHUB_ENV

      - name: Debug Terraform Variables File
        run: |
          echo "Using tfvars file: $TFVARS_FILE"
          ls -l ./tf
        working-directory: ./tf

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform plan \
            -var "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" \
            -var "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" \
            -var "ssh_public_key=$SSH_PUBLIC_KEY" \
            -var-file=$TFVARS_FILE
        working-directory: ./tf

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform apply -auto-approve \
            -var "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" \
            -var "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" \
            -var "ssh_public_key=$SSH_PUBLIC_KEY" \
            -var-file=$TFVARS_FILE
        working-directory: ./tf
