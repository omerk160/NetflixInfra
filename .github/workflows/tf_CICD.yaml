name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose the environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      region:
        description: "Choose AWS region"
        required: true
        default: "us-east-1"
        type: choice
        options:
          - us-east-1
          - eu-central-1

jobs:
  provision-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ github.event.inputs.region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform/${{ github.event.inputs.environment }}

      - name: Plan Terraform
        run: terraform plan -var="aws_region=${{ github.event.inputs.region }}"
        working-directory: terraform/${{ github.event.inputs.environment }}

      - name: Apply Terraform
        run: terraform apply -auto-approve -var="aws_region=${{ github.event.inputs.region }}"
        working-directory: terraform/${{ github.event.inputs.environment }}
